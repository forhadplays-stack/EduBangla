<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
user-select: none;
-webkit-user-select: none;
}
body {
font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
background: #0f172a;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
overflow: hidden;
}

#game-wrapper {
position: relative;
width: 100vw;
height: 100vh;
max-width: 450px;
max-height: 850px;
background: #000;
overflow: hidden;
box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
border: 3px solid rgba(255, 255, 255, 0.15);
}

@media (min-width: 500px) {
#game-wrapper {
border-radius: 28px;
border: 4px solid #38bdf8;
}
}

#game-canvas {
width: 100%;
height: 100%;
display: block;
touch-action: none;
}

#ui-layer {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
pointer-events: none;
display: flex;
flex-direction: column;
justify-content: space-between;
padding: 16px;
z-index: 10;
}

.hud-header {
display: flex;
justify-content: space-between;
align-items: center;
}

.hud-card {
background: rgba(15, 23, 42, 0.85);
backdrop-filter: blur(10px);
color: #fff;
padding: 8px 18px;
border-radius: 20px;
font-size: 16px;
font-weight: 800;
border: 1px solid rgba(255, 255, 255, 0.25);
box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}

#question-box {
background: rgba(255, 255, 255, 0.96);
backdrop-filter: blur(12px);
color: #0f172a;
padding: 16px 20px;
border-radius: 20px;
font-size: 18px;
font-weight: 800;
text-align: center;
box-shadow: 0 12px 30px rgba(0,0,0,0.35), inset 0 0 0 2px #38bdf8;
margin-top: 10px;
pointer-events: auto;
}

#feedback-popup {
position: absolute;
top: 38%;
left: 50%;
transform: translate(-50%, -50%) scale(0.7);
padding: 20px 30px;
border-radius: 24px;
font-size: 22px;
font-weight: 900;
text-align: center;
color: #fff;
opacity: 0;
transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
box-shadow: 0 25px 50px rgba(0,0,0,0.6);
z-index: 20;
width: 85%;
}

#feedback-popup.active {
opacity: 1;
transform: translate(-50%, -50%) scale(1);
}

.msg-correct {
background: linear-gradient(135deg, #10b981, #059669);
border: 3px solid #6ee7b7;
}

.msg-wrong {
background: linear-gradient(135deg, #ef4444, #dc2626);
border: 3px solid #fca5a5;
}
</style>

let currentQIndex = 0;
let score = 0;
let isWaiting = false;

qTotal.innerText = quizData.length;

// 🎧 উন্নত সাউন্ড সিস্টেম (Audio Engine)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
if (audioCtx.state === 'suspended') audioCtx.resume();
const now = audioCtx.currentTime;

// ১. তীর টানার সাউন্ড
if (type === 'pull') {
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'triangle';
osc.frequency.setValueAtTime(80, now);
osc.frequency.linearRampToValueAtTime(180, now + 0.15);
gain.gain.setValueAtTime(0.05, now);
gain.gain.linearRampToValueAtTime(0, now + 0.15);
osc.connect(gain); gain.connect(audioCtx.destination);
osc.start(now); osc.stop(now + 0.15);
}
// ২. রিয়েলিস্টিক তীরের "Whoosh" সাউন্ড
else if (type === 'shoot') {
// স্ন্যাপ সাউন্ড (Snap)
const snapOsc = audioCtx.createOscillator();
const snapGain = audioCtx.createGain();
snapOsc.type = 'sine';
snapOsc.frequency.setValueAtTime(400, now);
snapOsc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
snapGain.gain.setValueAtTime(0.3, now);
snapGain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
snapOsc.connect(snapGain); snapGain.connect(audioCtx.destination);
snapOsc.start(now); snapOsc.stop(now + 0.08);

// বাতাস চিরে যাওয়ার বাতাসি সাউন্ড (Air Swoosh)
const bufferSize = audioCtx.sampleRate * 0.2;
const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
const data = buffer.getChannelData(0);
for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
const noise = audioCtx.createBufferSource();
noise.buffer = buffer;

const filter = audioCtx.createBiquadFilter();
filter.type = 'bandpass';
filter.frequency.setValueAtTime(600, now);
filter.frequency.exponentialRampToValueAtTime(1800, now + 0.15);

const gain = audioCtx.createGain();
gain.gain.setValueAtTime(0.3, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
noise.start(now);
}
// ৩. বিজয়ের বিভিন্ন প্রকার সাউন্ড (Random Winner Sound Effects)
else if (type === 'correct') {
const randChoice = Math.floor(Math.random() * 3);

if (randChoice === 0) {
// Trumpet Fanfare
const notes = [523.25, 659.25, 783.99, 1046.50];
notes.forEach((f, i) => {
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'triangle';
osc.frequency.setValueAtTime(f, now + i * 0.09);
gain.gain.setValueAtTime(0.2, now + i * 0.09);
gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.35);
osc.connect(gain); gain.connect(audioCtx.destination);
osc.start(now + i * 0.09); osc.stop(now + i * 0.09 + 0.35);
});
} else if (randChoice === 1) {
// Coin Chime
const notes = [987.77, 1318.51];
notes.forEach((f, i) => {
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'sine';
osc.frequency.setValueAtTime(f, now + i * 0.08);
gain.gain.setValueAtTime(0.25, now + i * 0.08);
gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.3);
osc.connect(gain); gain.connect(audioCtx.destination);
osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.3);
});
} else {
// Upward Arcade Arpeggio
[440, 554.37, 659.25, 880].forEach((f, i) => {
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'square';
osc.frequency.setValueAtTime(f, now + i * 0.06);
gain.gain.setValueAtTime(0.1, now + i * 0.06);
gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.06 + 0.2);
osc.connect(gain); gain.connect(audioCtx.destination);
osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.2);
});
}
}
// ৪. ভুল উত্তরের বিভিন্ন প্রকার ফানি ও স্যাড সাউন্ড (Random Sad Sound Effects)
else if (type === 'wrong') {
const randChoice = Math.floor(Math.random() * 3);

if (randChoice === 0) {
// Sad Trombone (Wah Wah Wah)
const notes = [300, 280, 260, 220];
notes.forEach((f, i) => {
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(f, now + i * 0.15);
gain.gain.setValueAtTime(0.2, now + i * 0.15);
gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.25);
osc.connect(gain); gain.connect(audioCtx.destination);
osc.start(now + i * 0.15); osc.stop(now + i * 0.15 + 0.25);
});
} else if (randChoice === 1) {
// Cartoon Slide Whistle Down
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'sine';
osc.frequency.setValueAtTime(500, now);
osc.frequency.exponentialRampToValueAtTime(120, now + 0.4);
gain.gain.setValueAtTime(0.25, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
osc.connect(gain); gain.connect(audioCtx.destination);
osc.start(now); osc.stop(now + 0.4);
} else {
// Error Buzzer
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(130, now);
gain.gain.setValueAtTime(0.2, now);
gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
osc.connect(gain); gain.connect(audioCtx.destination);
osc.start(now); osc.stop(now + 0.35);
}
}
}

class ConfettiParticle {
constructor(x, y) {
this.x = x;
this.y = y;
this.size = Math.random() * 8 + 4;
this.vx = (Math.random() - 0.5) * 12;
this.vy = (Math.random() - 0.7) * 10;
this.gravity = 0.25;
this.rotation = Math.random() * Math.PI * 2;
this.rotSpeed = (Math.random() - 0.5) * 0.2;
this.colors = ['#facc15', '#f59e0b', '#38bdf8', '#34d399', '#f43f5e', '#ffffff'];
this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
this.alpha = 1;
}

draw() {
ctx.save();
ctx.globalAlpha = this.alpha;
ctx.translate(this.x, this.y);
ctx.rotate(this.rotation);
ctx.fillStyle = this.color;
ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
ctx.restore();
}

update() {
this.x += this.vx;
this.y += this.vy;
this.vy += this.gravity;
this.rotation += this.rotSpeed;
this.alpha -= 0.015;
}
}

let confettiList = [];

function triggerConfettiExplosion(x, y) {
for (let i = 0; i < 45; i++) {
confettiList.push(new ConfettiParticle(x, y));
}
}

const balloonThemes = [
{ main: '#ef4444', shine: '#fca5a5' },
{ main: '#0284c7', shine: '#7dd3fc' },
{ main: '#10b981', shine: '#6ee7b7' },
{ main: '#eab308', shine: '#fde047' }
];

class Balloon {
constructor(x, y, index, text) {
this.x = x;
this.y = y;
this.rx = 34;
this.ry = 44;
this.index = index;
this.text = text;
this.theme = balloonThemes[index % balloonThemes.length];
this.speed = 0.8 + Math.random() * 0.4;
this.swing = Math.random() * Math.PI * 2;
this.popped = false;
}

draw() {
if(this.popped) return;
ctx.save();

ctx.beginPath();
ctx.moveTo(this.x, this.y + this.ry);
ctx.quadraticCurveTo(this.x + Math.sin(this.swing)*8, this.y + this.ry + 20, this.x, this.y + this.ry + 40);
ctx.strokeStyle = 'rgba(255,255,255,0.7)';
ctx.lineWidth = 1.8;
ctx.stroke();

let grad = ctx.createRadialGradient(this.x - 10, this.y - 12, 3, this.x, this.y, this.rx);
grad.addColorStop(0, this.theme.shine);
grad.addColorStop(0.8, this.theme.main);

ctx.beginPath();
ctx.ellipse(this.x, this.y, this.rx, this.ry, 0, 0, Math.PI * 2);
ctx.fillStyle = grad;
ctx.fill();

ctx.beginPath();
ctx.moveTo(this.x - 4, this.y + this.ry);
ctx.lineTo(this.x + 4, this.y + this.ry);
ctx.lineTo(this.x, this.y + this.ry + 5);
ctx.fillStyle = this.theme.main;
ctx.fill();

ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
ctx.beginPath();
ctx.roundRect(this.x - 30, this.y - 11, 60, 22, 6);
ctx.fill();

ctx.fillStyle = '#0f172a';
ctx.font = 'bold 12px Kalpurush, sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText(this.text, this.x, this.y);

ctx.restore();
}

update() {
if(this.popped) return;
this.y += this.speed;
this.swing += 0.03;
this.x += Math.sin(this.swing) * 0.4;

if (this.y - this.ry > canvas.height) {
this.y = -60;
}
}
}

class FlyingArrow {
constructor(x, y, vx, vy, angle) {
this.x = x;
this.y = y;
this.vx = vx;
this.vy = vy;
this.angle = angle;
this.active = true;
}

draw() {
if (!this.active) return;
ctx.save();
ctx.translate(this.x, this.y);
ctx.rotate(this.angle);

ctx.strokeStyle = '#582f0e';
ctx.lineWidth = 3.5;
ctx.beginPath();
ctx.moveTo(-35, 0);
ctx.lineTo(10, 0);
ctx.stroke();

ctx.fillStyle = '#dc2626';
ctx.beginPath();
ctx.moveTo(-35, 0);
ctx.lineTo(-44, -6);
ctx.lineTo(-38, 0);
ctx.lineTo(-44, 6);
ctx.closePath();
ctx.fill();

ctx.fillStyle = '#94a3b8';
ctx.beginPath();
ctx.moveTo(10, -4);
ctx.lineTo(24, 0);
ctx.lineTo(10, 4);
ctx.closePath();
ctx.fill();

ctx.restore();
}

update() {
if (!this.active) return;
this.x += this.vx;
this.y += this.vy;
this.vy += 0.04;
this.angle = Math.atan2(this.vy, this.vx);

if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
this.active = false;
}
}
}

let balloons = [];
let arrows = [];

function loadQuestion() {
isWaiting = false;
feedbackPopup.classList.remove('active');

const q = quizData[currentQIndex];
questionBox.innerText = q.question;
qNum.innerText = currentQIndex + 1;

balloons = [];
const spacing = canvas.width / 4;
for (let i = 0; i < 4; i++) {
const x = spacing * i + spacing / 2;
const y = Math.random() * -150 - 50;
balloons.push(new Balloon(x, y, i, q.options[i]));
}
}

function checkCollision(arrow, balloon) {
if (balloon.popped) return false;
const dx = arrow.x - balloon.x;
const dy = arrow.y - balloon.y;
return (dx * dx) / (balloon.rx * balloon.rx) + (dy * dy) / (balloon.ry * balloon.ry) <= 1;
}

function handleAnswer(selectedIdx, balloon) {
isWaiting = true;
balloon.popped = true;

const q = quizData[currentQIndex];

if (selectedIdx === q.answer) {
score += 10;
scoreVal.innerText = score;
triggerConfettiExplosion(balloon.x, balloon.y);
playSound('correct');

const randomMsg = correctMessages[Math.floor(Math.random() * correctMessages.length)];
feedbackPopup.className = 'msg-correct active';
feedbackPopup.innerHTML = `${randomMsg}`;
} else {
playSound('wrong');

const randomMsg = wrongMessages[Math.floor(Math.random() * wrongMessages.length)];
feedbackPopup.className = 'msg-wrong active';
feedbackPopup.innerHTML = `${randomMsg}<br><span style="font-size:15px; font-weight:600; opacity:0.9">সঠিক উত্তর: <b>${q.options[q.answer]}</b></span>`;
}

setTimeout(() => {
currentQIndex = (currentQIndex + 1) % quizData.length;
loadQuestion();
}, 2300);
}

let isAiming = false;
let bowCenter = { x: 0, y: 0 };
let currentDrag = { x: 0, y: 0 };

function getPos(evt) {
const rect = canvas.getBoundingClientRect();
const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
return { x: clientX - rect.left, y: clientY - rect.top };
}

const onStart = (e) => {
if (isWaiting) return;
const pos = getPos(e);
if (pos.y > canvas.height - 200) {
isAiming = true;
bowCenter = { x: canvas.width / 2, y: canvas.height - 80 };
currentDrag = pos;
playSound('pull');
}
};

const onMove = (e) => {
if (!isAiming) return;
currentDrag = getPos(e);
};

const onEnd = () => {
if (!isAiming) return;
isAiming = false;

const dx = bowCenter.x - currentDrag.x;
const dy = bowCenter.y - currentDrag.y;
const dist = Math.min(Math.sqrt(dx * dx + dy * dy), 100);

if (dist > 15) {
const angle = Math.atan2(dy, dx);
const power = dist * 0.22;
arrows.push(new FlyingArrow(bowCenter.x, bowCenter.y, Math.cos(angle) * power, Math.sin(angle) * power, angle));
playSound('shoot');
}
};

canvas.addEventListener('mousedown', onStart);
canvas.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onEnd);

canvas.addEventListener('touchstart', onStart, { passive: true });
canvas.addEventListener('touchmove', onMove, { passive: true });
window.addEventListener('touchend', onEnd);

function drawArcheryBow() {
const center = { x: canvas.width / 2, y: canvas.height - 80 };

ctx.save();
ctx.translate(center.x, center.y);

let angle = -Math.PI / 2;
let pull = 0;

if (isAiming) {
const dx = bowCenter.x - currentDrag.x;
const dy = bowCenter.y - currentDrag.y;
angle = Math.atan2(dy, dx);
pull = Math.min(Math.sqrt(dx * dx + dy * dy), 75);

ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
ctx.setLineDash([6, 6]);
ctx.beginPath();
ctx.moveTo(0, 0);
ctx.lineTo(Math.cos(angle) * 160, Math.sin(angle) * 160);
ctx.stroke();
ctx.setLineDash([]);
}

ctx.rotate(angle);

if (bowImage.complete && bowImage.naturalWidth !== 0) {
ctx.drawImage(bowImage, -60, -75, 120, 150);
}

ctx.strokeStyle = '#ffffff';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(0, -50);
ctx.lineTo(-pull, 0);
ctx.lineTo(0, 50);
ctx.stroke();

ctx.strokeStyle = '#582f0e';
ctx.lineWidth = 3.5;
ctx.beginPath();
ctx.moveTo(-pull, 0);
ctx.lineTo(-pull + 50, 0);
ctx.stroke();

ctx.restore();
}

function render() {
ctx.clearRect(0, 0, canvas.width, canvas.height);

if (bgImage.complete && bgImage.naturalWidth !== 0) {
ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
}

balloons.forEach(b => {
if (!isWaiting) b.update();
b.draw();
});

arrows.forEach(a => {
a.update();
a.draw();

if (a.active && !isWaiting) {
balloons.forEach(b => {
if (checkCollision(a, b)) {
a.active = false;
handleAnswer(b.index, b);
}
});
}
});
arrows = arrows.filter(a => a.active);

confettiList.forEach((c, idx) => {
c.update();
c.draw();
if (c.alpha <= 0) confettiList.splice(idx, 1);
});

drawArcheryBow();

requestAnimationFrame(render);
}

loadQuestion();
render();
</script>
